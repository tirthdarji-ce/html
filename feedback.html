<main>

<div class="container">

<section class="heading">

<h2>Student Feedback</h2>

<p>

We value your opinion! Your feedback helps us improve StudentHub and provide
a better learning experience for all students.

</p>

</section>



<section class="feedback-form">

<h2>Feedback Form</h2>

<form>

<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" placeholder="Enter your email address" required>

<label>Select Feedback Type</label>

<select required>

<option value="">Choose Feedback Type</option>
<option>Website Design</option>
<option>Study Materials</option>
<option>Events</option>
<option>Technical Support</option>
<option>Suggestion</option>
<option>Complaint</option>

</select>

<label>Overall Rating</label>

<div class="rating">

<label><input type="radio" name="rating"> Excellent</label>

<label><input type="radio" name="rating"> Good</label>

<label><input type="radio" name="rating"> Average</label>

<label><input type="radio" name="rating"> Poor</label>

</div>

<label>Your Feedback</label>

<textarea rows="6" placeholder="Write your valuable feedback here..." required></textarea>

<button type="submit">Submit Feedback</button>

</form>

</section>

</div>

</main>
