<section class="page-heading"><p class="eyebrow">HELP US IMPROVE</p><h2>Student Feedback</h2><p class="lead">Share your experience and suggestions.</p></section>
<section class="form-panel narrow"><form action="php/feedback.php" method="post"><div class="field"><label for="feedbackName">Full name</label><input id="feedbackName" name="name" required></div><div class="field"><label for="feedbackEmail">Email address</label><input id="feedbackEmail" name="email" type="email" required></div><div class="field"><label for="feedbackType">Feedback type</label><select id="feedbackType" name="type" required><option value="">Choose one</option><option>Website Design</option><option>Study Materials</option><option>Events</option><option>Technical Support</option><option>Suggestion</option><option>Complaint</option></select></div><fieldset class="field"><legend>Overall rating</legend><label class="inline"><input type="radio" name="rating" value="Excellent" required> Excellent</label><label class="inline"><input type="radio" name="rating" value="Good"> Good</label><label class="inline"><input type="radio" name="rating" value="Average"> Average</label><label class="inline"><input type="radio" name="rating" value="Poor"> Poor</label></fieldset><div class="field"><label for="feedbackText">Your feedback</label><textarea id="feedbackText" name="message" rows="5" required></textarea></div><button class="button" type="submit">Submit Feedback</button></form></section>
