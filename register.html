    <meta charset="UTF-8">

    <script src="script.js"></script>
</head>

    <img src="logo.png" alt="StudentHub Logo">

</header>

    <a href="index.html">Home</a>

<main>
    <div class="container">
        <h2>Student Registration Form</h2>

        <form id="registrationForm">
            <!-- Name -->
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">
            <span id="nameError" class="error"></span>

            <!-- Email -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
            <span id="emailError" class="error"></span>

            <!-- Mobile -->
            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter 10 digit mobile number">
            <span id="mobileError" class="error"></span>

            <!-- Password -->
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter password">
            <span id="strength"></span>
            <span id="passwordError" class="error"></span>

            <!-- Confirm Password -->
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password">
            <span id="confirmError" class="error"></span>

            <!-- Course -->
            <label for="course">Course:</label>
            <select id="course" name="course">
                <option value="">Select Course</option>
                <option value="Computer Engineering">Computer Engineering</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Civil Engineering">Civil Engineering</option>
            </select>
            <span id="courseError" class="error"></span>

            <!-- Year -->
            <label for="year">Year:</label>
            <select id="year" name="year">
                <option value="">Select Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>
            <span id="yearError" class="error"></span>

            <!-- Gender -->
            <label>Gender:</label>
            <div class="gender">
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
                <input type="radio" name="gender" value="Other"> Other
            </div>
            <span id="genderError" class="error"></span>

            <!-- Terms -->
            <div class="terms">
                <left><input type="checkbox" id="terms" name="terms"></left>
            <label for="terms">I accept the terms and conditions</label>
            </div>
            <span id="termsError" class="error"></span>

            <!-- Submit -->
            <button type="submit">Register</button>

            <p id="success"></p>
        </form>
    </div>
</main>

</body>
</html>
